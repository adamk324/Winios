name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Winios.xcodeproj -scheme Winios
      - name: Prepare build output
        run: mkdir -p build
      - name: Build iOS Simulator
        run: xcodebuild -project Winios.xcodeproj -scheme Winios -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/simulator-build.log
      - name: Build generic iOS device
        run: xcodebuild -project Winios.xcodeproj -scheme Winios -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/device-build.log
      - name: Run simulator tests
        run: |
          set -o pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          xcodebuild -project Winios.xcodeproj -scheme Winios -destination "id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/WiniosTests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/test.log
          if grep -qF '** TEST FAILED **' build/test.log; then
            echo 'xcodebuild reported a failed test run.'
            exit 1
          fi
      - name: Build unsigned iOS 15 release app
        run: |
          set -o pipefail
          xcodebuild -project Winios.xcodeproj -scheme Winios -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/ipa-build.log
      - name: Package and verify test.ipa
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Winios.app"
          test -d "$APP_PATH"
          MINIMUM_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test "$MINIMUM_OS" = "15.0"
          test "$BUNDLE_ID" = "com.adamk324.winios"
          test -f "$APP_PATH/$EXECUTABLE"
          ARCHITECTURES="$(/usr/bin/lipo -archs "$APP_PATH/$EXECUTABLE")"
          [[ " $ARCHITECTURES " == *" arm64 "* ]]
          test ! -e "$APP_PATH/embedded.mobileprovision"
          mkdir -p build/ipa-staging/Payload
          /usr/bin/ditto "$APP_PATH" build/ipa-staging/Payload/Winios.app
          (cd build/ipa-staging && /usr/bin/zip -qry ../test.ipa Payload)
          /usr/bin/unzip -tq build/test.ipa
          echo "IPA: build/test.ipa"
          echo "MinimumOSVersion: $MINIMUM_OS"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Architectures: $ARCHITECTURES"
          echo "Signing: unsigned; no Apple certificate or provisioning profile"
      - name: Upload TrollStore test IPA
        uses: actions/upload-artifact@v4
        with:
          name: winios-${{ github.sha }}-ios15-test-ipa-unsigned
          path: |
            build/test.ipa
            build/ipa-build.log
          if-no-files-found: error
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winios-${{ github.sha }}-ios-build-results
          path: |
            build/*.log
            build/WiniosTests.xcresult
            build/DerivedData/Build/Products/Debug-iphonesimulator/Winios.app
          if-no-files-found: warn
